<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102f3a">
  <title>Reset password — IGNIS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20261126-1">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js" defer></script>
  <script src="reset-password.js?v=20260925-0921" defer></script>
</head>
<body>
  <main class="login-wrap">
    <section class="login-brand">
      <div class="login-crest" aria-hidden="true">I</div>
      <p class="eyebrow">IGNIS School · Nsawam, Ghana</p>
      <h1>Secure access.</h1>
      <p>Choose a new password for your IGNIS account.</p>
    </section>
    <section class="login-panel">
      <form id="resetForm" class="login-card">
        <div class="login-mobile-mark" aria-hidden="true">I</div>
        <p class="eyebrow">Account recovery</p>
        <h2>Set a new password</h2>
        <label for="password">New password</label>
        <div class="password-field">
          <input id="password" name="password" type="password" minlength="10" autocomplete="new-password" required>
          <button id="togglePassword" type="button" aria-controls="password" aria-pressed="false" aria-label="Show password">Show</button>
        </div>
        <label for="confirmPassword">Confirm new password</label>
        <div class="password-field">
          <input id="confirmPassword" name="confirmPassword" type="password" minlength="10" autocomplete="new-password" required>
          <button id="toggleConfirmPassword" type="button" aria-controls="confirmPassword" aria-pressed="false" aria-label="Show password">Show</button>
        </div>
        <button class="primary login-button" type="submit">Save password</button>
        <p id="resetMessage" class="login-error" role="status"></p>
        <a id="requestFreshLink" class="link" href="index.html" hidden>Return to sign in and request a fresh link</a>
      </form>
    </section>
  </main>
</body>
</html>
